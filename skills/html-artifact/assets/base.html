<!doctype html>
<html lang="en" data-artifact-delivery="connected">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact title</title>
  <!-- Replace title/content. This is a foundation, not a page design.
       Tailwind powers ordinary asset styling. Keep the connected default or reuse
       the host's styling runtime. Select portable only for a no-runtime-network
       requirement, and embed compiled Tailwind CSS in that case.
       Reuse available project branding/favicon; the QP mark is the fallback. -->
  <style>
    @layer base {
      *, *::before, *::after { box-sizing: border-box; }
      :root { color-scheme: light dark; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      /* Minimal reading fallback; composition lives in Tailwind classes. */
      body { margin: 0; background: Canvas; color: CanvasText; font: 1rem/1.55 system-ui, sans-serif;
        overflow-wrap: anywhere; }
      img, svg, video, canvas { max-inline-size: 100%; block-size: auto; }
      button, input, select, textarea { font: inherit; }
      [id] { scroll-margin-block-start: 1.5rem; }
      table { border-collapse: collapse; inline-size: 100%; }
      th, td { text-align: start; vertical-align: top; padding: .6rem; overflow-wrap: anywhere; }
    }
    [hidden] { display: none !important; }
    :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
      outline: 3px solid var(--artifact-focus-color, currentColor); outline-offset: 3px;
    }
    .visually-hidden, [data-visually-hidden] { position: absolute; inline-size: 1px; block-size: 1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .skip-link { position: fixed; inset: .5rem auto auto .5rem; transform: translateY(-180%);
      z-index: 10000; padding: .7rem; background: Canvas; color: CanvasText; }
    .skip-link:focus { transform: none; }
    [data-table-wrap], [data-overflow-safe], .visual-frame { max-inline-size: 100%; min-inline-size: 0; overflow: auto; }
    [data-table-wrap] { container-type: inline-size; }
    [data-long-text] { white-space: pre-wrap; overflow-wrap: anywhere; }
    [data-log] { max-block-size: 32rem; overflow: auto; white-space: pre-wrap; }
    .print-only { display: none; }
    @container (max-width: 40rem) { [data-table-wrap] > table { min-inline-size: var(--artifact-table-min-inline-size, 36rem); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
    @media print {
      :root, html[data-theme] { color-scheme: light; }
      .screen-only, [data-print="hide"], [data-theme-toggle], [data-back-to-top] { display: none !important; }
      .print-only { display: revert !important; }
      details[data-print-expand]:not([open]) > :not(summary) { display: block !important; }
      [data-table-wrap] { container-type: normal; overflow: visible !important; }
      [data-table-wrap] > table { min-inline-size: 0 !important; }
    }
  </style>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where([data-theme="dark"], [data-theme="dark"] *));
  </style>
  <script>
    (() => {
      const root = document.documentElement;
      root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (root.dataset.artifactDelivery !== 'connected') return;
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js';
      script.async = true;
      script.addEventListener('error', () => {
        root.dataset.tailwind = 'unavailable';
        const report = () => {
          const status = document.querySelector('[data-runtime-status]');
          if (status) status.textContent = 'Styling enhancement unavailable; base content remains readable.';
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', report, {once: true});
        else report();
      });
      script.addEventListener('load', () => { root.dataset.tailwind = 'loaded'; });
      document.head.append(script);
    })();
  </script>
</head>
<body class="p-4 pb-20 sm:p-8 sm:pb-20">
<a class="skip-link" href="#artifact-content">Skip to content</a>
<div class="artifact-shell mx-auto max-w-6xl">
  <header class="artifact-header flex flex-wrap items-center justify-between gap-4" id="artifact-top" tabindex="-1">
    <div class="artifact-brand block rounded bg-neutral-950 px-3 py-2" role="img" aria-label="Quanti Pixels">
      <!-- Inline copy of brand.svg keeps the default artifact self-contained. -->
      <svg viewBox="0 0 160 132" width="48" height="40" aria-hidden="true" focusable="false">
        <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#fff"><circle cx="45" cy="42" r="27"/><circle cx="115" cy="42" r="27"/>
            <path d="M8 42h10M142 42h10M72 42v53M88 42v53"/></g>
          <circle cx="45" cy="65" r="6.5" fill="#fff"/><circle cx="115" cy="65" r="6.5" fill="#fff"/>
          <path stroke="#d52e1e" d="M41 108Q80 134 119 108"/>
        </g>
      </svg>
    </div>
    <button type="button" class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-md border px-3 py-2" data-theme-toggle hidden>
      <svg data-theme-icon="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <svg data-theme-icon="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
      <span data-theme-label>Change theme</span>
    </button>
  </header>
  <main id="artifact-content" class="mt-8" tabindex="-1">
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">Artifact title</h1>
    <!-- Compose supplied content here; copy only useful control assets. -->
  </main>
  <p class="mt-4 text-sm" data-runtime-status role="status"></p>
  <footer class="mt-8 border-t pt-4"><small>Built with <a class="underline underline-offset-2" href="https://github.com/quantipixels/skills">QP Skills</a>. Single HTML; source data is static. Reader choices are not saved.
    <span data-delivery-disclosure>Confirm the selected delivery and dependency boundary.</span></small></footer>
</div>
<a class="fixed right-4 bottom-4 inline-flex min-h-11 items-center gap-2 rounded-full border bg-[Canvas] px-4 py-3 text-[CanvasText]" data-back-to-top href="#artifact-top"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 14 6-6 6 6M12 8v12"/></svg><span>Back to top</span></a>
<script>
  (() => {
    const root = document.documentElement;
    const button = document.querySelector('[data-theme-toggle]');
    const media = matchMedia('(prefers-color-scheme: dark)');
    let followsSystem = true;
    const apply = dark => {
      root.dataset.theme = dark ? 'dark' : 'light';
      button.querySelector('[data-theme-label]').textContent = dark ? 'Use light theme' : 'Use dark theme';
      button.querySelector('[data-theme-icon="sun"]').toggleAttribute('hidden', !dark);
      button.querySelector('[data-theme-icon="moon"]').toggleAttribute('hidden', dark);
    };
    apply(media.matches);
    button.hidden = false;
    button.addEventListener('click', () => { followsSystem = false; apply(root.dataset.theme !== 'dark'); });
    media.addEventListener('change', event => { if (followsSystem) apply(event.matches); });
    document.querySelector('[data-delivery-disclosure]').textContent = root.dataset.artifactDelivery === 'connected'
      ? 'Runtime: Tailwind CSS 4.3.3 (CDN); list other selected dependencies here.'
      : root.dataset.artifactDelivery === 'host'
        ? 'Styling: supplied by the containing application.'
        : 'Styling: embedded CSS; no remote runtime selected.';
    document.querySelector('[data-back-to-top]').addEventListener('click', () => {
      requestAnimationFrame(() => document.getElementById('artifact-top').focus({preventScroll: true}));
    });
  })();
</script>
</body>
</html>
