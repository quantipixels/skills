<!-- Style-neutral visual carousel; preserve/translate existing data-carousel-* labels.
     Supply stable item IDs. All slides remain readable without JS and in print.
     Selection is transient: explicit deep links are read, never written by controls.
     Compact/labeled/overlay compositions remain styling choices. -->
<style>
  [data-carousel] { position: relative; }
  [data-carousel-item][hidden] { display: none !important; }
  [data-carousel-controls] { display: flex; align-items: center; gap: .75rem; }
  [data-carousel-position] { font-variant-numeric: tabular-nums; }
  [dir="rtl"] [data-carousel-direction-glyph] { display: inline-block; transform: scaleX(-1); }
  [data-carousel-controls][data-carousel-composition="overlay"] { position: absolute; inset: 0; justify-content: space-between; pointer-events: none; }
  [data-carousel-controls][data-carousel-composition="overlay"] button { pointer-events: auto; }
  @media print {
    [data-carousel-controls], [data-carousel-live] { display: none !important; }
    [data-carousel-item][hidden] { display: block !important; }
  }
</style>
<section data-carousel tabindex="0" aria-label="Example visual collection"
  data-carousel-role-description="carousel" data-carousel-item-role-description="slide"
  data-carousel-previous-label="Previous item" data-carousel-next-label="Next item"
  data-carousel-position-template="{current} of {total}"
  data-carousel-item-label-template="Item {current}"
  data-carousel-announcement-template="{label}. Item {current} of {total}.">
  <p data-carousel-live data-visually-hidden aria-live="polite" aria-atomic="true"></p>
  <div data-carousel-track>
    <!-- Supply figures with id, data-carousel-item, role=group and aria-label. -->
  </div>
  <div data-carousel-controls data-carousel-composition="compact" hidden>
    <button type="button" data-carousel-previous><span data-carousel-direction-glyph aria-hidden="true">&lt;</span><span data-carousel-previous-text data-visually-hidden></span></button>
    <output data-carousel-position aria-live="off"></output>
    <button type="button" data-carousel-next><span data-carousel-direction-glyph aria-hidden="true">&gt;</span><span data-carousel-next-text data-visually-hidden></span></button>
  </div>
</section>
<script>
(() => {
  const format = (template, values) => template.replace(/\{(current|total|label)\}/g, (_, key) => String(values[key]));
  document.querySelectorAll('[data-carousel]').forEach(carousel => {
    if (carousel.dataset.carouselReady) return;
    const owned = selector => [...carousel.querySelectorAll(selector)].filter(el => el.closest('[data-carousel]') === carousel);
    const items = owned('[data-carousel-item]');
    const controls = owned('[data-carousel-controls]')[0];
    const previous = owned('[data-carousel-previous]')[0];
    const next = owned('[data-carousel-next]')[0];
    const position = owned('[data-carousel-position]')[0];
    const live = owned('[data-carousel-live]')[0];
    const beforeLabel = previous?.querySelector('[data-carousel-previous-text]');
    const afterLabel = next?.querySelector('[data-carousel-next-text]');
    const strings = {
      role: carousel.dataset.carouselRoleDescription, itemRole: carousel.dataset.carouselItemRoleDescription,
      previous: carousel.dataset.carouselPreviousLabel, next: carousel.dataset.carouselNextLabel,
      position: carousel.dataset.carouselPositionTemplate, item: carousel.dataset.carouselItemLabelTemplate,
      announcement: carousel.dataset.carouselAnnouncementTemplate
    };
    if (!items.length || !controls || !previous || !next || !position || !live || !beforeLabel || !afterLabel ||
        Object.values(strings).some(value => !value) || items.some(item => !item.id) ||
        new Set(items.map(item => item.id)).size !== items.length) return;
    carousel.setAttribute('aria-roledescription', strings.role);
    beforeLabel.textContent = strings.previous;
    afterLabel.textContent = strings.next;
    items.forEach(item => item.setAttribute('aria-roledescription', strings.itemRole));
    let current = 0;
    const select = index => {
      current = Math.max(0, Math.min(index, items.length - 1));
      const moveFocus = items.some((item, i) => i !== current && item.contains(document.activeElement));
      items.forEach((item, i) => { item.hidden = i !== current; });
      previous.disabled = current === 0;
      next.disabled = current === items.length - 1;
      const values = {current: current + 1, total: items.length};
      position.textContent = format(strings.position, values);
      live.textContent = format(strings.announcement, {...values, label: items[current].getAttribute('aria-label') || format(strings.item, values)});
      if (moveFocus) carousel.focus({preventScroll: true});
    };
    previous.addEventListener('click', () => select(current - 1));
    next.addEventListener('click', () => select(current + 1));
    carousel.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.target.closest('[data-carousel]') !== carousel ||
          event.target.closest('a,button,input,select,textarea,summary,[contenteditable],[role="slider"]')) return;
      const rtl = getComputedStyle(carousel).direction === 'rtl';
      if (event.key === 'ArrowLeft') select(current + (rtl ? 1 : -1));
      else if (event.key === 'ArrowRight') select(current + (rtl ? -1 : 1));
      else if (event.key === 'Home') select(0);
      else if (event.key === 'End') select(items.length - 1);
      else return;
      event.preventDefault();
    });
    const reveal = () => {
      let target;
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch { return; }
      const item = target?.closest('[data-carousel-item]');
      if (item && items.includes(item)) {
        select(items.indexOf(item));
        requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
      }
    };
    select(0);
    controls.hidden = items.length < 2;
    carousel.dataset.carouselReady = 'true';
    window.addEventListener('hashchange', reveal);
    reveal();
  });
})();
</script>
