<!-- Tailwind asset: start from base.html; restyle utilities, preserve data hooks.
     Style-neutral visual carousel; preserve/translate existing data-carousel-* labels.
     Supply stable item IDs. All slides remain readable without JS and in print.
     Selection is transient: explicit deep links are read, never written by controls.
     Compact/labeled/overlay compositions remain styling choices. -->
<style>
  /* Same layer as Preflight: specificity preserves complete print content. */
  @layer base {
    @media print {
      [data-carousel-controls], [data-carousel-live] { display: none !important; }
      [data-carousel-item][hidden] { display: block !important; }
    }
  }
</style>
<section class="relative space-y-3" data-carousel tabindex="0" aria-label="Example visual collection"
  data-carousel-role-description="carousel" data-carousel-item-role-description="slide"
  data-carousel-previous-label="Previous item" data-carousel-next-label="Next item"
  data-carousel-position-template="{current} of {total}"
  data-carousel-item-label-template="Item {current}"
  data-carousel-announcement-template="{label}. Item {current} of {total}.">
  <p data-carousel-live class="sr-only" data-visually-hidden aria-live="polite" aria-atomic="true"></p>
  <div data-carousel-track>
    <!-- Supply figures with id, data-carousel-item, role=group and aria-label. -->
  </div>
  <div class="flex items-center gap-3 data-[carousel-composition=overlay]:absolute data-[carousel-composition=overlay]:inset-0 data-[carousel-composition=overlay]:justify-between data-[carousel-composition=overlay]:pointer-events-none" data-carousel-controls data-carousel-composition="compact" hidden>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 pointer-events-auto" type="button" data-carousel-previous><svg class="inline-block rtl:-scale-x-100" data-carousel-direction-glyph viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span data-carousel-previous-text class="sr-only" data-visually-hidden></span></button>
    <output class="tabular-nums" data-carousel-position aria-live="off"></output>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 pointer-events-auto" type="button" data-carousel-next><svg class="inline-block rtl:-scale-x-100" data-carousel-direction-glyph viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg><span data-carousel-next-text class="sr-only" data-visually-hidden></span></button>
  </div>
</section>
<script>
(($) => {
  if (!$) return;
  const format = (template, values) => template.replace(/\{(current|total|label)\}/g, (_, key) => String(values[key]));
  $('[data-carousel]').each((_, carousel) => {
    const $carousel = $(carousel);
    if ($carousel.attr('data-carousel-ready')) return;
    const owned = selector => $carousel.find(selector).filter((_, el) => $(el).closest('[data-carousel]')[0] === carousel).toArray();
    const items = owned('[data-carousel-item]');
    const controls = owned('[data-carousel-controls]')[0];
    const previous = owned('[data-carousel-previous]')[0];
    const next = owned('[data-carousel-next]')[0];
    const position = owned('[data-carousel-position]')[0];
    const live = owned('[data-carousel-live]')[0];
    const beforeLabel = $(previous).find('[data-carousel-previous-text]')[0];
    const afterLabel = $(next).find('[data-carousel-next-text]')[0];
    const strings = {
      role: $carousel.attr('data-carousel-role-description'), itemRole: $carousel.attr('data-carousel-item-role-description'),
      previous: $carousel.attr('data-carousel-previous-label'), next: $carousel.attr('data-carousel-next-label'),
      position: $carousel.attr('data-carousel-position-template'), item: $carousel.attr('data-carousel-item-label-template'),
      announcement: $carousel.attr('data-carousel-announcement-template')
    };
    if (!items.length || !controls || !previous || !next || !position || !live || !beforeLabel || !afterLabel ||
        Object.values(strings).some(value => !value) || items.some(item => !$(item).attr('id')) ||
        new Set(items.map(item => $(item).attr('id'))).size !== items.length) return;
    $carousel.attr('aria-roledescription', strings.role);
    $(beforeLabel).text(strings.previous);
    $(afterLabel).text(strings.next);
    items.forEach(item => $(item).attr('aria-roledescription', strings.itemRole));
    let current = 0;
    const select = index => {
      current = Math.max(0, Math.min(index, items.length - 1));
      const focusedItem = $(document.activeElement).closest('[data-carousel-item]')[0];
      const moveFocus = items.includes(focusedItem) && items[current] !== focusedItem;
      items.forEach((item, i) => { $(item).prop('hidden', i !== current); });
      $(previous).prop('disabled', current === 0);
      $(next).prop('disabled', current === items.length - 1);
      const values = {current: current + 1, total: items.length};
      $(position).text(format(strings.position, values));
      $(live).text(format(strings.announcement, {...values, label: $(items[current]).attr('aria-label') || format(strings.item, values)}));
      if (moveFocus) carousel.focus({preventScroll: true});
    };
    $(previous).on('click', () => select(current - 1));
    $(next).on('click', () => select(current + 1));
    $carousel.on('keydown', event => {
      if (event.isDefaultPrevented() || $(event.target).closest('[data-carousel]')[0] !== carousel ||
          $(event.target).closest('a,button,input,select,textarea,summary,[contenteditable],[role="slider"]').length) return;
      const rtl = $carousel.css('direction') === 'rtl';
      if (event.key === 'ArrowLeft') select(current + (rtl ? 1 : -1));
      else if (event.key === 'ArrowRight') select(current + (rtl ? -1 : 1));
      else if (event.key === 'Home') select(0);
      else if (event.key === 'End') select(items.length - 1);
      else return;
      event.preventDefault();
    });
    const reveal = () => {
      let target;
      try { target = $('#' + $.escapeSelector(decodeURIComponent(location.hash.slice(1))))[0]; } catch { return; }
      const item = $(target).closest('[data-carousel-item]')[0];
      if (item && items.includes(item)) {
        select(items.indexOf(item));
        requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
      }
    };
    select(0);
    $(controls).prop('hidden', items.length < 2);
    $carousel.attr('data-carousel-ready', 'true');
    $(window).on('hashchange', reveal);
    reveal();
  });
})(window.jQuery);
</script>
