<!-- Tailwind asset: start from base.html; restyle utilities, preserve data hooks.
     Category filter with optional text search/reset. Existing data-filter-* token
     contract is retained. Closest-root ownership isolates nested collections.
     Controls stay hidden on invalid input. No-JS/print shows the full population.
     Labels/templates are artifact data; state is transient. -->
<style>
  @media print {
    [data-filter-controls], [data-filter-status], [data-filter-zero] { display: none !important; }
    [data-filter-item][hidden] { display: revert !important; }
  }
</style>
<section class="space-y-3" data-collection-filter data-filter-all-value="all"
  data-filter-result-template="Showing {count} of {total} items for {label}."
  data-filter-zero-template="No items match {label}." aria-label="Example findings">
  <div class="flex flex-wrap items-center gap-3" data-filter-controls role="group" aria-label="Filter findings" hidden>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 aria-pressed:font-semibold aria-pressed:underline underline-offset-4" type="button" data-filter-control data-filter-value="all" aria-pressed="true">All</button>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 aria-pressed:font-semibold aria-pressed:underline underline-offset-4" type="button" data-filter-control data-filter-value="required" aria-pressed="false">Required</button>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 aria-pressed:font-semibold aria-pressed:underline underline-offset-4" type="button" data-filter-control data-filter-value="optional" aria-pressed="false">Optional</button>
    <label class="inline-flex min-w-0 max-w-full flex-wrap items-center gap-2">Search <input class="min-h-11 min-w-0 max-w-full rounded-md border px-3 py-2" type="search" data-filter-search autocomplete="off"></label>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50" type="button" data-filter-reset>Reset</button>
  </div>
  <p class="text-sm tabular-nums" data-filter-status role="status" aria-atomic="true"></p>
  <p class="text-sm" data-filter-zero hidden></p>
  <div data-filter-items>
    <!-- Add real data-filter-item elements with declared comma-separated data-filter-values. -->
  </div>
</section>
<script>
(() => {
  const tokens = value => value.split(',').map(token => token.trim()).filter(Boolean);
  const format = (template, values) => template.replace(/\{(count|total|label)\}/g, (_, key) => String(values[key]));
  document.querySelectorAll('[data-collection-filter]').forEach(filter => {
    if (filter.dataset.filterReady) return;
    const owned = selector => [...filter.querySelectorAll(selector)].filter(el => el.closest('[data-collection-filter]') === filter);
    const controls = owned('[data-filter-controls]')[0];
    const status = owned('[data-filter-status]')[0];
    const zero = owned('[data-filter-zero]')[0];
    const items = owned('[data-filter-item]');
    const buttons = owned('button[data-filter-control][data-filter-value]');
    const search = owned('[data-filter-search]')[0];
    const reset = owned('[data-filter-reset]')[0];
    const all = filter.dataset.filterAllValue;
    const result = filter.dataset.filterResultTemplate;
    const empty = filter.dataset.filterZeroTemplate;
    const values = buttons.map(button => button.dataset.filterValue);
    const pressed = buttons.filter(button => button.getAttribute('aria-pressed') === 'true');
    if (!controls || !status || !zero || !items.length || !all || !result || !empty ||
        buttons.length < 2 || new Set(values).size !== values.length || !values.includes(all) ||
        values.some(value => !value || value.includes(',') || value !== value.trim()) ||
        buttons.some(button => !button.textContent.trim()) || pressed.length > 1 ||
        !['{count}', '{total}', '{label}'].every(token => result.includes(token)) || !empty.includes('{label}') ||
        items.some(item => !tokens(item.dataset.filterValues || '').length ||
          tokens(item.dataset.filterValues || '').some(token => token === all || !values.includes(token)))) return;
    let active = pressed[0]?.dataset.filterValue || all;
    if (search) search.value = '';
    const apply = () => {
      const query = search?.value.trim().toLocaleLowerCase() || '';
      const button = buttons.find(button => button.dataset.filterValue === active);
      let count = 0;
      buttons.forEach(candidate => candidate.setAttribute('aria-pressed', String(candidate === button)));
      items.forEach(item => {
        const visible = (active === all || tokens(item.dataset.filterValues).includes(active)) &&
          (!query || item.textContent.toLocaleLowerCase().includes(query));
        if (!visible && item.contains(document.activeElement)) (search || button).focus({preventScroll: true});
        item.hidden = !visible;
        if (visible) count++;
      });
      const label = button.textContent.trim() + (query ? ` / ${search.value.trim()}` : '');
      const data = {count, total: items.length, label};
      status.textContent = format(result, data);
      zero.textContent = format(empty, data);
      zero.hidden = count !== 0;
    };
    buttons.forEach(button => button.addEventListener('click', () => { active = button.dataset.filterValue; apply(); }));
    search?.addEventListener('input', apply);
    reset?.addEventListener('click', () => { active = all; if (search) search.value = ''; apply(); });
    apply();
    controls.hidden = false;
    filter.dataset.filterReady = 'true';
  });
})();
</script>
