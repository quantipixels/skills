<!-- Tailwind asset: start from base.html; restyle utilities, preserve data hooks.
     Selection/detail, comparison or finite guided sequence. Replace illustrative
     content/IDs; style freely. One button per panel; previous/next/reset optional.
     All content remains readable without JS and in print. No storage, URL writes,
     exports or approval semantics. Repeated inclusion is safe. -->
<section class="space-y-3" data-artifact-view data-view-position-template="{current} of {total}: {label}" aria-label="Example walkthrough">
  <div class="flex flex-wrap items-center gap-2" data-view-controls hidden>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 aria-pressed:font-semibold aria-pressed:underline underline-offset-4" type="button" data-view-target="view-before">Before</button>
    <button class="min-h-11 cursor-pointer rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50 aria-pressed:font-semibold aria-pressed:underline underline-offset-4" type="button" data-view-target="view-after">After</button>
    <button class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50" type="button" data-view-previous><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg>Previous</button>
    <button class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50" type="button" data-view-next>Next<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-md border px-3 py-2 disabled:cursor-default disabled:opacity-50" type="button" data-view-reset><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.6 6.4M3 17v-6h6"/></svg>Reset</button>
  </div>
  <p class="text-sm tabular-nums" data-view-status role="status" aria-atomic="true"></p>
  <section id="view-before" data-view-panel tabindex="-1"><h3>Before</h3><p>Replace with the supplied baseline.</p></section>
  <section id="view-after" data-view-panel tabindex="-1"><h3>After</h3><p>Replace with the supplied comparison.</p></section>
</section>
<script>
(($) => {
  if (!$) return;
  $('[data-artifact-view]').each((_, view) => {
    const $view = $(view);
    if ($view.attr('data-view-ready')) return;
    const owned = selector => $view.find(selector).filter((_, el) => $(el).closest('[data-artifact-view]')[0] === view).toArray();
    const panels = owned('[data-view-panel]');
    const buttons = owned('button[data-view-target]');
    const controls = owned('[data-view-controls]')[0];
    const status = owned('[data-view-status]')[0];
    const template = $view.attr('data-view-position-template');
    const ids = panels.map(panel => $(panel).attr('id'));
    if (!controls || !status || !template || !panels.length || buttons.length !== panels.length ||
        !['{current}', '{total}', '{label}'].every(token => template.includes(token)) ||
        ids.some(id => !id) || new Set(ids).size !== ids.length ||
        buttons.some(button => !ids.includes($(button).attr('data-view-target')) || !$(button).text().trim()) ||
        new Set(buttons.map(button => $(button).attr('data-view-target'))).size !== ids.length) return;
    const previous = owned('[data-view-previous]')[0];
    const next = owned('[data-view-next]')[0];
    const reset = owned('[data-view-reset]')[0];
    const initial = Math.max(0, ids.indexOf($view.attr('data-view-initial')));
    let index = initial;
    const select = value => {
      index = Math.max(0, Math.min(value, panels.length - 1));
      const targetButton = buttons.find(button => $(button).attr('data-view-target') === ids[index]);
      const focusedPanel = $(document.activeElement).closest('[data-view-panel]')[0];
      const focusWillHide = panels.includes(focusedPanel) && panels[index] !== focusedPanel;
      panels.forEach((panel, i) => { $(panel).prop('hidden', i !== index); });
      buttons.forEach(button => {
        $(button).attr({'aria-controls': $(button).attr('data-view-target'), 'aria-pressed': String(button === targetButton)});
      });
      if (previous) $(previous).prop('disabled', index === 0);
      if (next) $(next).prop('disabled', index === panels.length - 1);
      const values = {current: index + 1, total: panels.length, label: $(targetButton).text().trim()};
      $(status).text(template.replace(/\{(current|total|label)\}/g, (_, key) => String(values[key])));
      if (focusWillHide) targetButton.focus({preventScroll: true});
    };
    buttons.forEach(button => $(button).on('click', () => select(ids.indexOf($(button).attr('data-view-target')))));
    $(previous).on('click', () => select(index - 1));
    $(next).on('click', () => select(index + 1));
    $(reset).on('click', () => select(initial));
    const revealHash = () => {
      let target;
      try { target = $('#' + $.escapeSelector(decodeURIComponent(location.hash.slice(1))))[0]; } catch { return; }
      const panel = $(target).closest('[data-view-panel]')[0];
      if (panel && panels.includes(panel)) {
        select(panels.indexOf(panel));
        requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
      }
    };
    select(initial);
    $(controls).prop('hidden', false);
    $view.attr('data-view-ready', 'true');
    $(window).on('hashchange', revealHash);
    revealHash();
  });
})(window.jQuery);
</script>
