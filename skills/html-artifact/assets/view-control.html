<!-- Selection/detail, comparison or finite guided sequence. Replace illustrative
     content/IDs; style freely. One button per panel; previous/next/reset optional.
     All content remains readable without JS and in print. No storage, URL writes,
     exports or approval semantics. Repeated inclusion is safe. -->
<style>
  [data-view-controls] { display: flex; flex-wrap: wrap; gap: .5rem; }
  [data-view-target][aria-pressed="true"] { font-weight: bold; text-decoration: underline; }
  [data-view-panel][hidden] { display: none !important; }
  @media print {
    [data-view-controls], [data-view-status] { display: none !important; }
    [data-view-panel][hidden] { display: block !important; }
  }
</style>
<section data-artifact-view data-view-position-template="{current} of {total}: {label}" aria-label="Example walkthrough">
  <div data-view-controls hidden>
    <button type="button" data-view-target="view-before">Before</button>
    <button type="button" data-view-target="view-after">After</button>
    <button type="button" data-view-previous>Previous</button>
    <button type="button" data-view-next>Next</button>
    <button type="button" data-view-reset>Reset</button>
  </div>
  <p data-view-status role="status" aria-atomic="true"></p>
  <section id="view-before" data-view-panel tabindex="-1"><h3>Before</h3><p>Replace with the supplied baseline.</p></section>
  <section id="view-after" data-view-panel tabindex="-1"><h3>After</h3><p>Replace with the supplied comparison.</p></section>
</section>
<script>
(() => {
  document.querySelectorAll('[data-artifact-view]').forEach(view => {
    if (view.dataset.viewReady) return;
    const owned = selector => [...view.querySelectorAll(selector)].filter(el => el.closest('[data-artifact-view]') === view);
    const panels = owned('[data-view-panel]');
    const buttons = owned('button[data-view-target]');
    const controls = owned('[data-view-controls]')[0];
    const status = owned('[data-view-status]')[0];
    const template = view.dataset.viewPositionTemplate;
    const ids = panels.map(panel => panel.id);
    if (!controls || !status || !template || !panels.length || buttons.length !== panels.length ||
        !['{current}', '{total}', '{label}'].every(token => template.includes(token)) ||
        ids.some(id => !id) || new Set(ids).size !== ids.length ||
        buttons.some(button => !ids.includes(button.dataset.viewTarget) || !button.textContent.trim()) ||
        new Set(buttons.map(button => button.dataset.viewTarget)).size !== ids.length) return;
    const previous = owned('[data-view-previous]')[0];
    const next = owned('[data-view-next]')[0];
    const reset = owned('[data-view-reset]')[0];
    const initial = Math.max(0, ids.indexOf(view.dataset.viewInitial));
    let index = initial;
    const select = value => {
      index = Math.max(0, Math.min(value, panels.length - 1));
      const targetButton = buttons.find(button => button.dataset.viewTarget === ids[index]);
      const focusWillHide = panels.some((panel, i) => i !== index && panel.contains(document.activeElement));
      panels.forEach((panel, i) => { panel.hidden = i !== index; });
      buttons.forEach(button => {
        button.setAttribute('aria-controls', button.dataset.viewTarget);
        button.setAttribute('aria-pressed', String(button === targetButton));
      });
      if (previous) previous.disabled = index === 0;
      if (next) next.disabled = index === panels.length - 1;
      const values = {current: index + 1, total: panels.length, label: targetButton.textContent.trim()};
      status.textContent = template.replace(/\{(current|total|label)\}/g, (_, key) => String(values[key]));
      if (focusWillHide) targetButton.focus({preventScroll: true});
    };
    buttons.forEach(button => button.addEventListener('click', () => select(ids.indexOf(button.dataset.viewTarget))));
    previous?.addEventListener('click', () => select(index - 1));
    next?.addEventListener('click', () => select(index + 1));
    reset?.addEventListener('click', () => select(initial));
    const revealHash = () => {
      let target;
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch { return; }
      const panel = target?.closest('[data-view-panel]');
      if (panel && panels.includes(panel)) {
        select(panels.indexOf(panel));
        requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
      }
    };
    select(initial);
    controls.hidden = false;
    view.dataset.viewReady = 'true';
    window.addEventListener('hashchange', revealHash);
    revealHash();
  });
})();
</script>
