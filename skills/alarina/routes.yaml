version: 2
entry:
  name: alarina
  default_family: route
families:
  route:
    alias: route
    description: Choose or explain the smallest useful engineering path.
    examples:
    - Which workflow should handle this?
    - Help me work out the next engineering step.
  investigate:
    alias: investigate
    description: Establish an explanation, diagnosis, comparison, recovery state, or retrospective.
    examples:
    - Find why this endpoint became slow.
    - Explain what caused this failure without fixing it.
  plan:
    alias: plan
    description: Resolve an unsettled outcome, domain, architecture, migration, or delivery sequence.
    examples:
    - Plan the tenant-key migration.
    - Work out the architecture before implementation.
  build:
    alias: build
    description: Implement and verify an accepted feature, fix, refactor, test, or migration.
    examples:
    - Fix the intermittent billing test.
    - Implement the accepted API change and verify it.
  review:
    alias: review
    description: Judge code, structure, evidence, or readiness without exceeding the requested stop.
    examples:
    - Review this branch for regressions.
    - Tell me whether this PR is ready without merging it.
  document:
    alias: document
    description: Explain technical material or reconcile durable documentation with current truth.
    examples:
    - Update the architecture overview for this change.
    - Explain this mechanism so another engineer can act on it.
  ship:
    alias: ship
    description: Prepare or carry an accepted candidate through an authorized PR, release, or rollout stop.
    examples:
    - Prepare and publish the PR.
    - Release this package and verify the published version.
  utility:
    alias: utility
    description: Use a requested operational or language utility within its invocation boundary.
    examples:
    - Reclaim safe build-cache space on this Mac.
    - Explain these Yoruba tone marks.
