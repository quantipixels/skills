<!-- Basecoat asset: start from base.html; preserve data hooks.
     Category filter with optional text search/reset. Existing data-filter-* token
     contract is retained. Closest-root ownership isolates nested collections.
     Controls stay hidden on invalid input. No-JS/print shows the full population.
     Labels/templates are artifact data; state is transient. -->
<section data-collection-filter data-filter-all-value="all"
 data-filter-result-template="Showing {count} of {total} items for {label}."
 data-filter-zero-template="No items match {label}." aria-label="Example findings">
  <div data-filter-controls role="group" aria-label="Filter findings" hidden>
    <button class="btn" data-variant="outline" type="button" data-filter-control data-filter-value="all" aria-pressed="true">All</button>
    <button class="btn" data-variant="outline" type="button" data-filter-control data-filter-value="required" aria-pressed="false">Required</button>
    <button class="btn" data-variant="outline" type="button" data-filter-control data-filter-value="optional" aria-pressed="false">Optional</button>
    <label>Search <input class="input" type="search" data-filter-search autocomplete="off"></label>
    <button class="btn" data-variant="outline" type="button" data-filter-reset><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.6 6.4M3 17v-6h6"/></svg>Reset</button>
  </div>
  <p data-filter-status role="status" aria-atomic="true"></p>
  <p data-filter-zero hidden></p>
  <div data-filter-items>
    <!-- Add real data-filter-item elements with declared comma-separated data-filter-values. -->
  </div>
</section>
<script>
(($) => {
  if (!$) return;
  const tokens = value => value.split(',').map(token => token.trim()).filter(Boolean);
  const format = (template, values) => template.replace(/\{(count|total|label)\}/g, (_, key) => String(values[key]));
  $('[data-collection-filter]').each((_, filter) => {
    const $filter = $(filter);
    if ($filter.attr('data-filter-ready')) return;
    const owned = selector => $filter.find(selector).filter((_, el) => $(el).closest('[data-collection-filter]')[0] === filter).toArray();
    const controls = owned('[data-filter-controls]')[0];
    const status = owned('[data-filter-status]')[0];
    const zero = owned('[data-filter-zero]')[0];
    const items = owned('[data-filter-item]');
    const buttons = owned('button[data-filter-control][data-filter-value]');
    const search = owned('[data-filter-search]')[0];
    const reset = owned('[data-filter-reset]')[0];
    const all = $filter.attr('data-filter-all-value');
    const result = $filter.attr('data-filter-result-template');
    const empty = $filter.attr('data-filter-zero-template');
    const values = buttons.map(button => $(button).attr('data-filter-value'));
    const pressed = buttons.filter(button => $(button).attr('aria-pressed') === 'true');
    if (!controls || !status || !zero || !items.length || !all || !result || !empty ||
        buttons.length < 2 || new Set(values).size !== values.length || !values.includes(all) ||
        values.some(value => !value || value.includes(',') || value !== value.trim()) ||
        buttons.some(button => !$(button).text().trim()) || pressed.length > 1 ||
        !['{count}', '{total}', '{label}'].every(token => result.includes(token)) || !empty.includes('{label}') ||
        items.some(item => !tokens($(item).attr('data-filter-values') || '').length ||
          tokens($(item).attr('data-filter-values') || '').some(token => token === all || !values.includes(token)))) return;
    let active = $(pressed[0]).attr('data-filter-value') || all;
    $(search).val('');
    const apply = () => {
      const searchText = String($(search).val() || '').trim();
      const query = searchText.toLocaleLowerCase();
      const button = buttons.find(button => $(button).attr('data-filter-value') === active);
      let count = 0;
      buttons.forEach(candidate => $(candidate).attr('aria-pressed', String(candidate === button)));
      items.forEach(item => {
        const visible = (active === all || tokens($(item).attr('data-filter-values')).includes(active)) &&
          (!query || $(item).text().toLocaleLowerCase().includes(query));
        if (!visible && (item === document.activeElement || $.contains(item, document.activeElement)))
          (search || button).focus({preventScroll: true});
        $(item).prop('hidden', !visible);
        if (visible) count++;
      });
      const label = $(button).text().trim() + (query ? ` / ${searchText}` : '');
      const data = {count, total: items.length, label};
      $(status).text(format(result, data));
      $(zero).text(format(empty, data)).prop('hidden', count !== 0);
    };
    buttons.forEach(button => $(button).on('click', () => { active = $(button).attr('data-filter-value'); apply(); }));
    $(search).on('input', apply);
    $(reset).on('click', () => { active = all; $(search).val(''); apply(); });
    apply();
    $(controls).prop('hidden', false);
    $filter.attr('data-filter-ready', 'true');
  });
})(window.jQuery);
</script>
