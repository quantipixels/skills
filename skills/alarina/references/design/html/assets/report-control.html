<!--
Reusable report behavior for HTML Artifact output.

Embed this script in every report after the report content. Give deep-link
targets stable ids. Add data-print-expand only to details whose contents are
required in a complete print or PDF. The base template supplies a print
fallback when JavaScript is unavailable.
-->

<script>
  (($) => {
    if (!$) return;
    const openedForPrint = new Set();

    const hashId = () => {
      try {
        return decodeURIComponent(window.location.hash.slice(1));
      } catch {
        return "";
      }
    };

    const revealTarget = () => {
      const id = hashId();
      const target = id ? $('#' + $.escapeSelector(id))[0] : null;
      if (!target) return;

      $(target).parents("details:not([open])").get().reverse().forEach(disclosure => $(disclosure).prop('open', true));
      requestAnimationFrame(() => target.scrollIntoView({ block: "start" }));
    };

    const expandForPrint = () => {
      $("details[data-print-expand]:not([open])").each((_, disclosure) => {
        openedForPrint.add(disclosure);
        $(disclosure).prop('open', true);
      });
    };

    const restoreAfterPrint = () => {
      openedForPrint.forEach((disclosure) => {
        if ($(disclosure).closest('html').length) $(disclosure).prop('open', false);
      });
      openedForPrint.clear();
    };

    $(window).on("hashchange", revealTarget);
    $(window).on("beforeprint", expandForPrint);
    $(window).on("afterprint", restoreAfterPrint);
    $(revealTarget);
  })(window.jQuery);
</script>
