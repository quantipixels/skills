<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact title</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <!-- Copy this template, favicon.png, and logo.svg together. Set the language,
       title, heading, and control labels for the artifact; add supplied content
       inside main. Keep the brand assets local when moving the output. -->
  <script>
  (() => {
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const root = document.documentElement;
    root.dataset.theme = media.matches ? "dark" : "light";
    root.dataset.themeSource = "system";
  })();
  </script>
  <style>
/*
Behavior-only foundation for HTML Artifact output.

Embed this file in the artifact. It supplies accessibility, resilience, media,
overflow, reduced-motion, and print plumbing without choosing an aesthetic.
*/

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

:where(img, picture, svg, video, canvas) {
  block-size: auto;
  max-inline-size: 100%;
}

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: var(--artifact-focus-width, 3px) solid var(--artifact-focus-color, currentColor);
  outline-offset: var(--artifact-focus-offset, 3px);
}

.visually-hidden,
[data-visually-hidden] {
  block-size: 1px;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  inline-size: 1px;
  overflow: hidden;
  position: absolute;
  white-space: nowrap;
}

.skip-link {
  background: Canvas;
  color: CanvasText;
  inset-block-start: 0;
  inset-inline-start: 0;
  padding: 0.5rem 0.75rem;
  position: fixed;
  transform: translateY(-150%);
  z-index: 10000;
}

.skip-link:focus {
  transform: translateY(0);
}

.visual-frame,
[data-overflow-safe] {
  max-inline-size: 100%;
  min-inline-size: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
}

:where([data-report-section], .artifact-section) + :where([data-report-section], .artifact-section) {
  margin-block-start: var(--artifact-section-gap, clamp(2.5rem, 6vw, 5rem));
}

:where(.artifact-table-wrap, [data-table-wrap]) {
  container-type: inline-size;
  max-inline-size: 100%;
  min-inline-size: 0;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}

:where(.artifact-table-wrap, [data-table-wrap]) > table {
  inline-size: 100%;
  table-layout: auto;
}

:where(.artifact-table-wrap, [data-table-wrap]) :where(th, td) {
  min-inline-size: 0;
  overflow-wrap: anywhere;
  vertical-align: top;
}

/* Adjust this component breakpoint and minimum width to fit the table's data. */
@container (max-width: 40rem) {
  :where(.artifact-table-wrap, [data-table-wrap]) > table {
    min-inline-size: var(--artifact-table-min-inline-size, 36rem);
  }
}

:where(.artifact-long-text, [data-long-text]) {
  display: block;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  max-inline-size: 100%;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  word-break: break-word;
}

:where(.artifact-log, [data-log]) {
  max-block-size: var(--artifact-log-max-block-size, 32rem);
  overflow: auto;
  overscroll-behavior: contain;
  white-space: pre-wrap;
}

.print-only {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

@media print {
  .screen-only,
  [data-print="hide"] {
    display: none !important;
  }

  .print-only {
    display: revert !important;
  }

  details[data-print-expand]:not([open]) > :not(summary) {
    display: block !important;
  }

  :where(a[href]) {
    overflow-wrap: anywhere;
  }

  :where(.artifact-table-wrap, [data-table-wrap]) {
    container-type: normal;
    overflow: visible !important;
  }

  :where(.artifact-table-wrap, [data-table-wrap]) > table {
    inline-size: 100% !important;
    min-inline-size: 0 !important;
  }
}

  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  .theme-toggle {
    align-items: center;
    background: var(--theme-control-bg, transparent);
    border: 1px solid var(--theme-control-border, currentColor);
    border-radius: 999px;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    height: 2.5rem;
    justify-content: center;
    width: 2.5rem;
  }

  .theme-toggle:focus-visible {
    outline: 3px solid var(--theme-control-focus, currentColor);
    outline-offset: 3px;
  }

  .theme-toggle svg { height: 1.25rem; width: 1.25rem; }
  .theme-toggle[hidden] { display: none; }
  .theme-toggle [data-theme-icon] { display: none; }
  html[data-theme="light"] .theme-toggle [data-theme-icon="dark"] { display: block; }
  html[data-theme="dark"] .theme-toggle [data-theme-icon="light"] { display: block; }

  @media print { .theme-toggle { display: none; } }

  [data-back-to-top-target] {
    scroll-margin-block-start: var(--back-to-top-scroll-margin, 1rem);
  }

  [data-back-to-top] {
    align-items: center;
    background: var(--back-to-top-background, Canvas);
    block-size: var(--back-to-top-size, 2.75rem);
    border: var(--back-to-top-border-width, 1px) solid var(--back-to-top-border-color, currentColor);
    border-radius: var(--back-to-top-radius, 50%);
    box-sizing: border-box;
    box-shadow: var(--back-to-top-shadow, 0 0.25rem 0.75rem rgb(0 0 0 / 0.18));
    color: var(--back-to-top-color, CanvasText);
    display: inline-flex;
    inline-size: var(--back-to-top-size, 2.75rem);
    bottom: max(var(--back-to-top-inset-bottom, 1rem), env(safe-area-inset-bottom));
    justify-content: center;
    padding: 0;
    position: fixed;
    right: max(var(--back-to-top-inset-right, 1rem), env(safe-area-inset-right));
    text-decoration: none;
    touch-action: manipulation;
    z-index: var(--back-to-top-z-index, 1000);
  }

  [data-back-to-top] svg {
    block-size: var(--back-to-top-icon-size, 1.25rem);
    fill: none;
    inline-size: var(--back-to-top-icon-size, 1.25rem);
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  @media print {
    [data-back-to-top] {
      display: none !important;
    }
  }

    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: clamp(1rem, 4vw, 3rem);
      padding-block-end: 5rem;
      background: Canvas;
      color: CanvasText;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .artifact-shell { max-inline-size: 72rem; margin-inline: auto; }
    .artifact-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .artifact-brand { display: block; flex-shrink: 0; padding: 0.5rem 0.75rem; border-radius: 0.25rem; background: #111; }
    .artifact-brand img { display: block; inline-size: 125px; }
    main { margin-block-start: 2rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#artifact-content">Skip to content</a>
  <div class="artifact-shell">
    <header class="artifact-header" id="artifact-top" data-back-to-top-target tabindex="-1">
      <div class="artifact-brand"><img src="logo.svg" width="500" height="132" alt="Quanti Pixels"></div>
<button
  class="theme-toggle"
  type="button"
  data-theme-toggle
  data-theme-light-label="Use light theme"
  data-theme-dark-label="Use dark theme"
  hidden
>
  <svg data-theme-icon="dark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <mask id="artifact-theme-moon-cutout">
      <rect width="24" height="24" fill="white"></rect>
      <circle cx="15" cy="8" r="7" fill="black"></circle>
    </mask>
    <circle cx="10" cy="12" r="8" fill="currentColor" stroke="none" mask="url(#artifact-theme-moon-cutout)"></circle>
  </svg>
  <svg data-theme-icon="light" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
  </svg>
  <span data-theme-label data-visually-hidden>Change theme</span>
</button>
    </header>
    <main id="artifact-content" tabindex="-1">
      <h1>Artifact title</h1>
      <!-- Add the supplied content and its governing representation here. -->
    </main>
  </div>
<a data-back-to-top href="#artifact-top">
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
    <path d="m6 15 6-6 6 6"></path>
  </svg>
  <span data-visually-hidden>Back to top</span>
</a>
  <script>
  (() => {
    const root = document.documentElement;
    const control = document.querySelector("[data-theme-toggle]");
    const labelText = control?.querySelector("[data-theme-label]");
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    if (!control || !labelText) return;

    const apply = (theme, source) => {
      root.dataset.theme = theme;
      root.dataset.themeSource = source;
      const next = theme === "dark" ? "light" : "dark";
      const label = next === "dark"
        ? control.dataset.themeDarkLabel
        : control.dataset.themeLightLabel;
      labelText.textContent = label;
      control.setAttribute("title", label);
    };

    apply(media.matches ? "dark" : "light", "system");
    control.hidden = false;
    control.addEventListener("click", () => {
      apply(root.dataset.theme === "dark" ? "light" : "dark", "user");
    });
    media.addEventListener("change", (event) => {
      if (root.dataset.themeSource === "system") {
        apply(event.matches ? "dark" : "light", "system");
      }
    });
  })();
  (() => {
    document.querySelectorAll("a[data-back-to-top][href^='#']").forEach((link) => {
      let id = "";
      try {
        id = decodeURIComponent(link.hash.slice(1));
      } catch {
        return;
      }

      const target = id ? document.getElementById(id) : null;
      if (!target || target.getAttribute("tabindex") !== "-1") return;

      link.addEventListener("click", (event) => {
        if (event.defaultPrevented
          || event.button !== 0
          || event.metaKey
          || event.ctrlKey
          || event.shiftKey
          || event.altKey) return;

        requestAnimationFrame(() => {
          if (target.isConnected) target.focus({ preventScroll: true });
        });
      });
    });
  })();
  </script>
</body>
</html>
