<!--
Reusable back-to-top control for HTML Artifact output.

Use this control when page length or navigation makes returning to the opening
context require substantial reverse scrolling. Add id="artifact-top",
data-back-to-top-target, and tabindex="-1" to the existing top landmark or
opening heading. Place the link after the final reader-facing content and
translate its accessible label to the artifact language. The default style
keeps that document order while presenting a floating icon at the bottom-right.

The native fragment link still scrolls when JavaScript is unavailable. The
script keeps keyboard focus aligned with the destination after navigation.
-->

<style>
  [data-back-to-top-target] {
    scroll-margin-block-start: var(--back-to-top-scroll-margin, 1rem);
  }

  [data-back-to-top] {
    align-items: center;
    background: var(--back-to-top-background, Canvas);
    block-size: var(--back-to-top-size, 2.75rem);
    border: var(--back-to-top-border-width, 1px) solid var(--back-to-top-border-color, currentColor);
    border-radius: var(--back-to-top-radius, 50%);
    box-sizing: border-box;
    box-shadow: var(--back-to-top-shadow, 0 0.25rem 0.75rem rgb(0 0 0 / 0.18));
    color: var(--back-to-top-color, CanvasText);
    display: inline-flex;
    inline-size: var(--back-to-top-size, 2.75rem);
    bottom: max(var(--back-to-top-inset-bottom, 1rem), env(safe-area-inset-bottom));
    justify-content: center;
    padding: 0;
    position: fixed;
    right: max(var(--back-to-top-inset-right, 1rem), env(safe-area-inset-right));
    text-decoration: none;
    touch-action: manipulation;
    z-index: var(--back-to-top-z-index, 1000);
  }

  [data-back-to-top] svg {
    block-size: var(--back-to-top-icon-size, 1.25rem);
    fill: none;
    inline-size: var(--back-to-top-icon-size, 1.25rem);
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  @media print {
    [data-back-to-top] {
      display: none !important;
    }
  }
</style>

<!--
Add the target attributes to the artifact's existing opening element:

<header id="artifact-top" data-back-to-top-target tabindex="-1">
  Add the supplied opening content here.
</header>
-->

<a data-back-to-top href="#artifact-top">
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
    <path d="m6 15 6-6 6 6"></path>
  </svg>
  <span data-visually-hidden>Back to top</span>
</a>

<script>
  (() => {
    document.querySelectorAll("a[data-back-to-top][href^='#']").forEach((link) => {
      let id = "";
      try {
        id = decodeURIComponent(link.hash.slice(1));
      } catch {
        return;
      }

      const target = id ? document.getElementById(id) : null;
      if (!target || target.getAttribute("tabindex") !== "-1") return;

      link.addEventListener("click", (event) => {
        if (event.defaultPrevented
          || event.button !== 0
          || event.metaKey
          || event.ctrlKey
          || event.shiftKey
          || event.altKey) return;

        requestAnimationFrame(() => {
          if (target.isConnected) target.focus({ preventScroll: true });
        });
      });
    });
  })();
</script>
