<!--
Reusable back-to-top control for HTML Artifact output.

Use this control when page length or navigation makes returning to the opening
context require substantial reverse scrolling. Add id="artifact-top",
data-back-to-top-target, and tabindex="-1" to the existing top landmark or
opening heading. Place the link after the final reader-facing content and
translate its visible text to the artifact language.

The native fragment link still scrolls when JavaScript is unavailable. The
script keeps keyboard focus aligned with the destination after navigation.
-->

<style>
  [data-back-to-top-target] {
    scroll-margin-block-start: var(--back-to-top-scroll-margin, 1rem);
  }

  [data-back-to-top] {
    align-items: center;
    display: inline-flex;
    max-inline-size: 100%;
    min-block-size: var(--back-to-top-min-block-size, 2.75rem);
    padding-block: var(--back-to-top-padding-block, 0.5rem);
    padding-inline: var(--back-to-top-padding-inline, 0.75rem);
  }

  @media print {
    [data-back-to-top] {
      display: none !important;
    }
  }
</style>

<!--
Add the target attributes to the artifact's existing opening element:

<header id="artifact-top" data-back-to-top-target tabindex="-1">
  Add the supplied opening content here.
</header>
-->

<a data-back-to-top href="#artifact-top">Back to top</a>

<script>
  (() => {
    document.querySelectorAll("a[data-back-to-top][href^='#']").forEach((link) => {
      let id = "";
      try {
        id = decodeURIComponent(link.hash.slice(1));
      } catch {
        return;
      }

      const target = id ? document.getElementById(id) : null;
      if (!target || target.getAttribute("tabindex") !== "-1") return;

      link.addEventListener("click", (event) => {
        if (event.defaultPrevented
          || event.button !== 0
          || event.metaKey
          || event.ctrlKey
          || event.shiftKey
          || event.altKey) return;

        requestAnimationFrame(() => {
          if (target.isConnected) target.focus({ preventScroll: true });
        });
      });
    });
  })();
</script>
