name: Greenfield final boundary verification
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: qp-greenfield-candidate-migration
  cancel-in-progress: false
jobs:
  finish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'greenfield-focused-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: greenfield-focused-skills
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct the reproduced cleanup boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          code = Path('scripts/distribution.py')
          text = code.read_text()
          old = 'def generation(root: Path, identity: str) -> Path:\n'
          new = old + '    if (root / "generations").is_symlink():\n        raise InstallError("Generations directory must not be a symlink")\n'
          if new not in text:
              assert old in text
              code.write_text(text.replace(old, new, 1))
              test = Path('scripts/test_distribution.py')
              text = test.read_text()
              anchor = '    def test_real_shell_entrypoints_work_with_spaces(self):'
              assert anchor in text
              test.write_text(text.replace(anchor, '''    def test_substituted_generation_parent_is_rejected_before_any_removal(self):
                  self.install('codex', 'claude')
                  old = d.current(self.root)
                  outside = self.work / 'outside-generations'
                  (self.root / 'generations').rename(outside)
                  (self.root / 'generations').symlink_to(outside, target_is_directory=True)
                  for action in (self.install, d.uninstall):
                      with self.assertRaises(d.InstallError): action()
                      self.assertTrue((outside / old / 'skills/alpha/SKILL.md').is_file())
                      self.assertTrue((self.home / '.agents/skills/alpha').is_symlink())
                      self.assertTrue((self.root / 'current').is_symlink())
                      self.assertFalse((self.root / 'transaction.json').exists())

          ''' + anchor))
              subprocess.run(['python', '-m', 'unittest', 'scripts/test_distribution.py'], check=True)
              subprocess.run(['git', 'add', 'scripts/distribution.py', 'scripts/test_distribution.py'], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix(distribution): reject substituted generation roots before cleanup'], check=True)
          # The retrieved source matched the original geometry; record verification, not a redesign.
          change = Path('.changeset/canonical-artifact-brand.md')
          change.write_text('---\n"qp-skills": patch\n---\n\nVerify the embedded Quantipixels wordmark against the official site asset, preserve its geometry, and keep an exact embedding regression. Its foreground remains legible when printing without backgrounds.\n')
          for file in (Path('skills/html-artifact/assets/brand.svg'), Path('skills/html-artifact/assets/base.html')):
              text = file.read_text().replace('aria-labelledby="title"', 'aria-labelledby="artifact-brand-title"').replace('<title id="title">', '<title id="artifact-brand-title">')
              file.write_text(text)
          subprocess.run(['git', 'add', '.changeset/canonical-artifact-brand.md', 'skills/html-artifact/assets'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix(html-artifact): scope embedded brand identity and record source verification'], check=True)
          PY
          git diff --exit-code
          git push origin HEAD:greenfield-focused-skills
