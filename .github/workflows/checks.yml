name: Package checks

on:
  pull_request:
  push:
    branches: [ori]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s scripts/plugins -p 'test_*.py' -v
      - run: python -m unittest discover -s proof -p 'test_*.py' -v
