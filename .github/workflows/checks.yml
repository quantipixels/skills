name: Package checks

on:
  pull_request:
  push:
    branches: [ori]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the project-owned local gate as the CI backstop
        run: npm run verify:local -- --output "$RUNNER_TEMP/alarina-checks"
      - name: Retain gate receipts and bounded logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarina-checks
          path: ${{ runner.temp }}/alarina-checks
          if-no-files-found: warn
          retention-days: 14
