name: Validate

on:
  pull_request:
    branches:
      - ori

permissions:
  contents: read

jobs:
  package-state:
    name: Package state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package lock
        run: npm ci

  akosile-tests:
    name: Akosile workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test workspace operations
        run: python3 -m unittest discover -s skills/engineering/akosile/scripts -p 'test_*.py'

  seda-pr-tests:
    name: seda-pr provider tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test seda-pr provider helper
        run: python3 -m unittest discover -s skills/engineering/seda-pr/scripts -p 'test_*.py'

  wo-pr-tests:
    name: wo-pr provider tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test wo-pr provider adapters
        run: python3 -m unittest discover -s skills/engineering/wo-pr/scripts -p 'test_*.py'
