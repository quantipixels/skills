name: Validate

on:
  pull_request:
    branches:
      - ori
      - feature/source-to-artifact-records-plan

permissions:
  contents: read

jobs:
  package-state:
    name: Package state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package lock
        run: npm ci

  skill-package:
    name: Skill package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python3 -m pip install -r skills/engineering/ko-skill/scripts/requirements.txt

      - name: Validate skill package
        run: python3 skills/engineering/ko-skill/scripts/validate-package.py --repo .

  akosile-tests:
    name: Akosile workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Akosile dependencies
        run: python3 -m pip install -r skills/engineering/akosile/scripts/requirements.txt

      - name: Test deterministic workspace operations
        run: python3 -m unittest discover -s skills/engineering/akosile/scripts -p 'test_*.py'

  wo-pr-tests:
    name: wo-pr snapshot tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test wo-pr fact normalization
        run: python3 -m unittest discover -s skills/engineering/wo-pr/scripts -p 'test_*.py'
