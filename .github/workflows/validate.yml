name: Validate

on:
  pull_request:
  push:
    branches:
      - ori
  merge_group:

permissions:
  contents: read

jobs:
  package-state:
    name: Package state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package lock
        run: npm ci

  skill-package:
    name: Skill package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python3 -m pip install -r skills/engineering/ko-skill/scripts/requirements.txt

      - name: Validate workflow contract
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Validate skill package
        run: python3 skills/engineering/ko-skill/scripts/validate-package.py --repo .

      - name: Validate plugin agents
        run: python3 skills/engineering/ko-skill/scripts/validate-plugin-agents.py --repo .

      - name: Test local session evidence adapter
        run: python3 -m unittest discover -s skills/productivity/ayewo-igba-ise/scripts -p 'test_*.py'

      - name: Setup Node.js for uninstall proof
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test safe global uninstall
        run: python3 -m unittest scripts/test_uninstall.py

  browser-controls:
    name: Browser controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser proof tools
        run: |
          python -m pip install -r .github/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise shipped controls and fallback
        run: python -m unittest discover -s .github/browser -p 'test_*.py'

  akosile-tests:
    name: Akosile focused mechanics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test safe-write and index renderer
        run: python3 -m unittest discover -s skills/engineering/akosile/scripts -p 'test_*.py'

  compatibility-smoke:
    name: Compatibility smoke
    runs-on: ubuntu-latest
    env:
      SKILLS_CLI_VERSION: 1.5.23
      DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover QP through Skills CLI
        run: |
          npx --yes skills@${SKILLS_CLI_VERSION} add "$GITHUB_WORKSPACE" --list | tee /tmp/qp-skills-list.txt
          grep -F 'alaga' /tmp/qp-skills-list.txt
          grep -F 'wo-pr' /tmp/qp-skills-list.txt
          grep -F 'root-cause' /tmp/qp-skills-list.txt

      - name: Install every QP skill for Codex
        run: |
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills@${SKILLS_CLI_VERSION} add "$GITHUB_WORKSPACE" --agent codex --skill '*' --copy -y

          expected="$(find "$GITHUB_WORKSPACE/skills" -mindepth 3 -maxdepth 3 -name SKILL.md | wc -l | tr -d ' ')"
          installed="$(find "$target/.agents/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"

          test "$installed" -eq "$expected"
          test -f "$target/.agents/skills/alaga/SKILL.md"
          test -f "$target/.agents/skills/root-cause/SKILL.md"

  validate:
    name: Validate
    if: ${{ always() }}
    needs:
      - package-state
      - skill-package
      - akosile-tests
      - browser-controls
      - compatibility-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          PACKAGE_STATE_RESULT: ${{ needs.package-state.result }}
          SKILL_PACKAGE_RESULT: ${{ needs.skill-package.result }}
          BROWSER_CONTROLS_RESULT: ${{ needs.browser-controls.result }}
          AKOSILE_TESTS_RESULT: ${{ needs.akosile-tests.result }}
          COMPATIBILITY_SMOKE_RESULT: ${{ needs.compatibility-smoke.result }}
        run: |
          test "$PACKAGE_STATE_RESULT" = success
          test "$SKILL_PACKAGE_RESULT" = success
          test "$AKOSILE_TESTS_RESULT" = success
          test "$BROWSER_CONTROLS_RESULT" = success
          test "$COMPATIBILITY_SMOKE_RESULT" = success
