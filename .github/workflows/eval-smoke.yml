name: Eval smoke

on:
  push:
    branches:
      - eval/pr41-behavior
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install Copilot CLI
        run: |
          npm install --global @github/copilot
          copilot version | tee copilot-version.txt
          copilot help > copilot-help.txt

      - name: Run isolated prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
        run: |
          mkdir -p "$RUNNER_TEMP/eval-empty"
          cd "$RUNNER_TEMP/eval-empty"
          copilot \
            --prompt 'Return exactly: EVAL_OK' \
            --silent \
            --model gpt-5.4 \
            --allow-all-tools \
            --no-ask-user \
            --no-custom-instructions \
            --no-remote \
            --no-auto-update \
            --no-color | tee "$GITHUB_WORKSPACE/output.txt"
          grep -qx 'EVAL_OK' "$GITHUB_WORKSPACE/output.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: |
            copilot-version.txt
            copilot-help.txt
            output.txt
