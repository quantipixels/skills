name: Publish verified local commits
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bundle and non-force push exact local commits
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/safety.0 .transfer/safety.1 .transfer/safety.2 .transfer/safety.3 > /tmp/safety.bundle
          echo '35ced8f3a789ee46efd4887253dd297ce11002613ff3731febbf910d97d287d3  /tmp/safety.bundle' | sha256sum -c -
          git bundle verify /tmp/safety.bundle
          git fetch /tmp/safety.bundle refs/heads/fix/mechanical-safety:refs/heads/fix/mechanical-safety
          expected=d4f36ee3f3157620aa461ec30082acec17bd2319
          test "$(git rev-parse refs/heads/fix/mechanical-safety)" = "$expected"
          remote="$(git ls-remote origin refs/heads/fix/mechanical-safety | cut -f1)"
          if [ -n "$remote" ] && [ "$remote" != "$expected" ]; then
            echo 'Ref exists with unexpected work; refusing publication' >&2
            exit 1
          fi
          git push origin refs/heads/fix/mechanical-safety:refs/heads/fix/mechanical-safety
          test "$(git ls-remote origin refs/heads/fix/mechanical-safety | cut -f1)" = "$expected"
          echo "Published exact local commit $expected"
