name: Publish verified local commits
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and transfer exact renderer objects
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/renderer.0 .transfer/renderer.1 .transfer/renderer.2 .transfer/renderer.3 .transfer/renderer.4 .transfer/renderer.5 .transfer/renderer.6a .transfer/renderer.6b .transfer/renderer.7 .transfer/renderer.8 > /tmp/renderer.bundle
          echo 'f361e388db1ce9e210669c7690abecca19a1a114c11979ccf3e2a9fb8843396e  /tmp/renderer.bundle' | sha256sum -c -
          git bundle verify /tmp/renderer.bundle
          git fetch /tmp/renderer.bundle refs/heads/feat/offline-relationship-renderer:refs/heads/feat/offline-relationship-renderer
          expected=909cabc2253ec646d9055206a26be20601ec2bee
          test "$(git rev-parse refs/heads/feat/offline-relationship-renderer)" = "$expected"
          remote="$(git ls-remote origin refs/heads/feat/offline-relationship-renderer | cut -f1)"
          if [ -n "$remote" ] && [ "$remote" != "$expected" ]; then
            echo 'Unexpected existing branch; refusing publication' >&2
            exit 1
          fi
          git push origin refs/heads/feat/offline-relationship-renderer:refs/heads/feat/offline-relationship-renderer
          test "$(git ls-remote origin refs/heads/feat/offline-relationship-renderer | cut -f1)" = "$expected"
