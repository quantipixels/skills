name: Publish verified local commits
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transfer verified component-isolation fix to staging
        shell: bash
        run: |
          set -euo pipefail
          echo '85c1483e9db3e72820ba4b058231aafbad010bea2869bc5db2aaa4d4c81dda43  .transfer/renderer-fix.bundle' | sha256sum -c -
          git bundle verify .transfer/renderer-fix.bundle
          git fetch .transfer/renderer-fix.bundle HEAD:refs/heads/local-renderer
          test "$(git rev-parse local-renderer)" = c9b30a73a10ce21d0e4f72bbfa22f67cd826889c
          test "$(git ls-remote origin refs/heads/work/staged-renderer | cut -f1)" = 909cabc2253ec646d9055206a26be20601ec2bee
          git push origin refs/heads/local-renderer:refs/heads/work/staged-renderer
          test "$(git ls-remote origin refs/heads/work/staged-renderer | cut -f1)" = c9b30a73a10ce21d0e4f72bbfa22f67cd826889c
