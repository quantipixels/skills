name: Audit checkout transfer
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and history without credentials
        shell: bash
        run: |
          set -euo pipefail
          git bundle create /tmp/qp-audit.bundle --all
          git archive --format=tar.gz 98402375ec5562e1aae19d0a080eacb445a8a09a > /tmp/qp-audit-source.tar.gz
          git clone --depth 1 https://github.com/cursor/plugins.git /tmp/cursor-plugins
          git -C /tmp/cursor-plugins rev-parse HEAD > /tmp/pstack-source-sha.txt
          tar -czf /tmp/pstack-source.tar.gz -C /tmp/cursor-plugins pstack
          git clone --depth 1 https://github.com/EveryInc/compound-engineering-plugin.git /tmp/compound-engineering
          git -C /tmp/compound-engineering rev-parse HEAD > /tmp/compound-source-sha.txt
          git -C /tmp/compound-engineering archive --format=tar.gz HEAD > /tmp/compound-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qp-audit-checkout
          retention-days: 1
          path: |
            /tmp/qp-audit.bundle
            /tmp/qp-audit-source.tar.gz
            /tmp/pstack-source-sha.txt
            /tmp/pstack-source.tar.gz
            /tmp/compound-source-sha.txt
            /tmp/compound-source.tar.gz
