name: Audit checkout transfer
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98402375ec5562e1aae19d0a080eacb445a8a09a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned build dependencies and observe native install schema
        shell: bash
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          mkdir /tmp/qp-render-deps
          cd /tmp/qp-render-deps
          printf '%s\n' '{"name":"qp-artifact-graph","version":"0.0.0","private":true,"type":"module"}' > package.json
          npm install --save-exact esbuild cytoscape
          npm ls --json > dependency-versions.json
          tar -czf /tmp/qp-render-deps.tar.gz -C /tmp qp-render-deps
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          cd "$GITHUB_WORKSPACE"
          npx --yes @anthropic-ai/claude-code@2.1.260 plugin marketplace add "$GITHUB_WORKSPACE" --scope user
          npx --yes @anthropic-ai/claude-code@2.1.260 plugin install qp-skills@qp-skills --scope user
          npx --yes @anthropic-ai/claude-code@2.1.260 plugin marketplace list --json > /tmp/claude-marketplaces.json
          npx --yes @anthropic-ai/claude-code@2.1.260 plugin list --json > /tmp/claude-plugins.json
          find "$CLAUDE_CONFIG_DIR" -name plugin.json -o -name installed_plugins.json > /tmp/claude-install-paths.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qp-build-dependencies
          retention-days: 1
          path: |
            /tmp/qp-render-deps.tar.gz
            /tmp/claude-marketplaces.json
            /tmp/claude-plugins.json
            /tmp/claude-install-paths.txt
