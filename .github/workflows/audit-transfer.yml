name: Export current repository
on:
  push:
    branches: [work/audit-transfer-20260905]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branches and export bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git bundle create /tmp/qp-current.bundle --all
          git show-ref --heads --remotes > /tmp/qp-current-refs.txt || true
          git rev-parse refs/remotes/origin/ori > /tmp/ori-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qp-current-repository
          retention-days: 1
          path: |
            /tmp/qp-current.bundle
            /tmp/qp-current-refs.txt
            /tmp/ori-sha.txt
