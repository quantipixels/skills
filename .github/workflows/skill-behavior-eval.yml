name: Skill behavior eval

on:
  push:
    branches:
      - eval/pr41-skill-behavior
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install llama.cpp runner
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run isolated local-model smoke prompt
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          llama serve \
            -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 --port 8080 -c 4096 \
            >"$RUNNER_TEMP/llama-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "model": "qwen",
              "messages": [
                  {"role": "system", "content": "Follow the user's instruction exactly."},
                  {"role": "user", "content": "Return exactly EVAL_OK and nothing else."}
              ],
              "temperature": 0,
              "max_tokens": 16,
              "seed": 41
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=180) as response:
              payload = json.load(response)
          text = payload["choices"][0]["message"]["content"].strip()
          print(text)
          if text != "EVAL_OK":
              raise SystemExit(f"unexpected output: {text!r}")
          PY
