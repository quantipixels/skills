name: HTML Artifact checks
on:
  pull_request:
    paths:
      - 'skills/html-artifact/**'
      - 'tests/test_html_artifact*.py'
      - '.github/workflows/html-artifact-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and rejection tests
        run: python3 tests/test_html_artifact.py
      - name: Install isolated browser and pinned renderer packages
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/qp-artifact-renderers" --ignore-scripts --no-audit --no-fund @tailwindcss/browser@4.3.3 mermaid@12.0.0
      - name: File opening, controls, reload and real renderer integration
        env:
          QP_RENDERER_PACKAGES: ${{ runner.temp }}/qp-artifact-renderers/node_modules
        run: python3 tests/test_html_artifact_browser.py
