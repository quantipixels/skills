name: Candidate source
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact candidate
        run: git archive --format=tar.gz --output "$RUNNER_TEMP/qp-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qp-candidate-source
          path: ${{ runner.temp }}/qp-source.tar.gz
          retention-days: 3
