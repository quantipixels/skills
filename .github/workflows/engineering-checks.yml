name: Engineering checker tests

on:
  pull_request:
    paths:
      - 'evals/engineering/**/*.py'
      - 'evals/engineering/fixtures/**'
      - '.github/workflows/engineering-checks.yml'
  push:
    branches: [ori]
    paths:
      - 'evals/engineering/**/*.py'
      - 'evals/engineering/fixtures/**'
      - '.github/workflows/engineering-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exercise checker integrity and independent oracles (no model calls)
        run: python -m unittest discover -s evals/engineering -p 'test_*.py' -v
