<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945" role="img" aria-labelledby="title desc">
  <title id="title">QP skills: recent additions and updates</title>
  <desc id="desc">A map of the new PR lifecycle, delivery skills, and updated artifact and skill-authoring workflows.</desc>

  <defs>
    <symbol id="qp-mark" viewBox="0 0 160 132">
      <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#202020">
          <circle cx="45" cy="42" r="27"/>
          <circle cx="115" cy="42" r="27"/>
          <path d="M8 42h10M142 42h10"/>
          <path d="M72 42v53M88 42v53"/>
        </g>
        <circle cx="45" cy="65" r="6.5" fill="#202020" stroke="none"/>
        <circle cx="115" cy="65" r="6.5" fill="#202020" stroke="none"/>
        <path stroke="#D52E1E" d="M41 108Q80 134 119 108"/>
      </g>
    </symbol>
    <symbol id="qp-full" viewBox="0 0 500 132">
      <use href="#qp-mark" width="160" height="132"/>
      <text x="178" y="78" fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">quanti pixels</text>
    </symbol>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-size: 17px; font-weight: 850; letter-spacing: 2.5px; }
      .headline { font-size: 78px; font-weight: 900; letter-spacing: -4px; }
      .lede { font-size: 24px; font-weight: 560; }
      .group-title { font-size: 46px; font-weight: 900; letter-spacing: -1.5px; }
      .group-note { font-size: 19px; font-weight: 560; }
      .skill { font-size: 31px; font-weight: 760; }
      .verb { font-size: 15px; font-weight: 900; letter-spacing: 1.3px; }
      .detail { font-size: 19px; font-weight: 520; }
      .small-skill { font-size: 24px; font-weight: 760; }
      .small-detail { font-size: 17px; font-weight: 520; }
      .flow { font-size: 12px; font-weight: 850; letter-spacing: 0.55px; }
      .outcome-label { font-size: 14px; font-weight: 900; letter-spacing: 2px; }
      .outcome { font-size: 21px; font-weight: 850; }
    </style>
  </defs>

  <rect width="1680" height="945" fill="#F7F7F7"/>
  <rect width="18" height="945" fill="#D52E1E"/>

  <text class="sans eyebrow" x="64" y="70" fill="#D52E1E">12–13 AUG 2026 · PRODUCT UPDATE</text>
  <use href="#qp-mark" x="62" y="82" width="108" height="89"/>
  <text class="sans headline" x="190" y="153" fill="#1E1E1E">SKILLS: WHAT CHANGED</text>
  <text class="sans lede" x="68" y="196" fill="#606060">New delivery skills. Sharper verification. Clearer ownership.</text>

  <!-- PR lifecycle grouping -->
  <g transform="translate(64 235)">
    <rect width="974" height="636" rx="28" fill="#0E0E0E"/>
    <rect width="12" height="636" rx="6" fill="#D52E1E"/>
    <text class="sans eyebrow" x="54" y="55" fill="#E14B39">NEW · TOP-LEVEL GROUPING</text>
    <text class="sans group-title" x="54" y="108" fill="#FFFFFF">PR LIFECYCLE</text>
    <text class="sans group-note" x="54" y="140" fill="#D1D1D1">Three focused skills own publication, explanation, and stewardship.</text>

    <path d="M83 206V476" stroke="#D52E1E" stroke-width="4"/>

    <circle cx="83" cy="223" r="25" fill="#D52E1E"/>
    <text class="sans verb" x="83" y="229" fill="#FFFFFF" text-anchor="middle">01</text>
    <text class="mono skill" x="129" y="219" fill="#FFFFFF">seda-pr</text>
    <rect x="129" y="233" width="207" height="34" rx="17" fill="#D52E1E"/>
    <text class="sans verb" x="232.5" y="255" fill="#FFFFFF" text-anchor="middle">OPEN OR RECONCILE</text>
    <text class="sans detail" x="347" y="223" fill="#D1D1D1">Creates a ready-for-review PR with clear context,</text>
    <text class="sans detail" x="347" y="250" fill="#D1D1D1">bounded metadata, and no duplicate item.</text>

    <circle cx="83" cy="355" r="25" fill="#D52E1E"/>
    <text class="sans verb" x="83" y="361" fill="#FFFFFF" text-anchor="middle">02</text>
    <text class="mono skill" x="129" y="351" fill="#FFFFFF">tunmo-pr</text>
    <rect x="129" y="365" width="146" height="34" rx="17" fill="#D52E1E"/>
    <text class="sans verb" x="202" y="387" fill="#FFFFFF" text-anchor="middle">EXPLAIN</text>
    <text class="sans detail" x="347" y="355" fill="#D1D1D1">Turns the current diff into a reviewer-ready guide:</text>
    <text class="sans detail" x="347" y="382" fill="#D1D1D1">purpose, behavior, risks, and the reading path.</text>

    <circle cx="83" cy="487" r="25" fill="#D52E1E"/>
    <text class="sans verb" x="83" y="493" fill="#FFFFFF" text-anchor="middle">03</text>
    <text class="mono skill" x="129" y="483" fill="#FFFFFF">wo-pr</text>
    <rect x="129" y="497" width="173" height="34" rx="17" fill="#D52E1E"/>
    <text class="sans verb" x="215.5" y="519" fill="#FFFFFF" text-anchor="middle">KEEP HEALTHY</text>
    <text class="sans detail" x="347" y="487" fill="#D1D1D1">Handles CI, conflicts, and actionable feedback</text>
    <text class="sans detail" x="347" y="514" fill="#D1D1D1">until a human merge decision.</text>

    <rect x="54" y="550" width="866" height="69" rx="22" fill="#202020" stroke="#D52E1E" stroke-width="2"/>
    <text class="sans outcome-label" x="76" y="573" fill="#E14B39">WHERE EACH FITS</text>
    <text class="sans flow" x="76" y="599" fill="#FFFFFF">READY CHANGE <tspan fill="#E14B39">→</tspan> <tspan class="mono">seda-pr</tspan> <tspan fill="#E14B39">→</tspan> OPEN PR</text>
    <text class="sans flow" x="390" y="587" fill="#FFFFFF">OPEN PR <tspan fill="#E14B39">→</tspan> <tspan class="mono">tunmo-pr</tspan> <tspan fill="#E14B39">→</tspan> REVIEW CONTEXT</text>
    <text class="sans flow" x="390" y="608" fill="#FFFFFF">OPEN PR <tspan fill="#E14B39">→</tspan> <tspan class="mono">wo-pr</tspan> <tspan fill="#E14B39">→</tspan> MERGE READINESS</text>
  </g>

  <!-- Delivery additions -->
  <g transform="translate(1070 235)">
    <rect width="546" height="360" rx="28" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="3"/>
    <path d="M0 28A28 28 0 0 1 28 0h146l40 40-40 40H0Z" fill="#D52E1E"/>
    <text class="sans eyebrow" x="28" y="49" fill="#FFFFFF">NEW · DELIVERY</text>

    <text class="mono small-skill" x="28" y="125" fill="#1E1E1E">seda-ticket</text>
    <rect x="343" y="96" width="172" height="32" rx="16" fill="#1E1E1E"/>
    <text class="sans verb" x="429" y="117" fill="#FFFFFF" text-anchor="middle">DECOMPOSE</text>
    <text class="sans small-detail" x="28" y="154" fill="#606060">Breaks supplied work into vertical, ready tickets.</text>
    <rect x="28" y="164" width="490" height="40" rx="15" fill="#F7F7F7"/>
    <text class="sans flow" x="43" y="180" fill="#1E1E1E">PLAN / SPEC / ISSUE <tspan fill="#D52E1E">→</tspan> <tspan class="mono">seda-ticket</tspan> <tspan fill="#D52E1E">→</tspan> READY TICKETS</text>
    <text class="sans flow" x="43" y="196" fill="#1E1E1E">READY TICKETS <tspan fill="#D52E1E">→</tspan> IMPLEMENTATION OWNER</text>

    <line x1="28" y1="216" x2="518" y2="216" stroke="#D1D1D1" stroke-width="2"/>

    <text class="mono small-skill" x="28" y="250" fill="#1E1E1E">triage-issue</text>
    <rect x="374" y="223" width="141" height="32" rx="16" fill="#1E1E1E"/>
    <text class="sans verb" x="444.5" y="244" fill="#FFFFFF" text-anchor="middle">ASSESS</text>
    <text class="sans small-detail" x="28" y="278" fill="#606060">Classifies a report and selects the next action.</text>
    <rect x="28" y="290" width="490" height="40" rx="15" fill="#F7F7F7"/>
    <text class="sans flow" x="43" y="306" fill="#1E1E1E">BUG REPORT <tspan fill="#D52E1E">→</tspan> <tspan class="mono">triage-issue</tspan> <tspan fill="#D52E1E">→</tspan> NEXT ACTION</text>
    <text class="sans flow" x="43" y="322" fill="#1E1E1E">NEXT ACTION <tspan fill="#D52E1E">→</tspan> IMPLEMENT / DEFER</text>

    <text class="sans outcome-label" x="28" y="350" fill="#D52E1E">OUTCOME · START WITH THE RIGHT WORK</text>
  </g>

  <!-- Updated workflows -->
  <g transform="translate(1070 612)">
    <rect width="546" height="259" rx="28" fill="#D52E1E"/>
    <text class="sans eyebrow" x="28" y="45" fill="#FFFFFF">UPDATED · QUALITY</text>

    <text class="mono small-skill" x="28" y="88" fill="#FFFFFF">html-artifact</text>
    <text class="sans small-detail" x="28" y="118" fill="#FFFFFF">TRANSLATE + CHECK</text>
    <text class="sans small-detail" x="215" y="118" fill="#F7F7F7">Portable, accessible visual artifacts</text>
    <text class="sans small-detail" x="215" y="140" fill="#F7F7F7">from supplied content and evidence.</text>

    <line x1="28" y1="164" x2="518" y2="164" stroke="#F7F7F7" stroke-opacity="0.5" stroke-width="2"/>

    <text class="mono small-skill" x="28" y="205" fill="#FFFFFF">ko-skill</text>
    <text class="sans small-detail" x="28" y="235" fill="#FFFFFF">AUTHOR + VALIDATE</text>
    <text class="sans small-detail" x="215" y="213" fill="#F7F7F7">Focused skills with proportionate</text>
    <text class="sans small-detail" x="215" y="235" fill="#F7F7F7">structural and behavioral proof.</text>
  </g>

  <text class="sans eyebrow" x="1070" y="914" fill="#606060">ADDITIONS: 5 SKILLS · UPDATED: 2 WORKFLOWS</text>
</svg>
